# Fly.io deployment config. Adjust app name and region.
app = "cutbackito"
primary_region = "mad"

[build]

[env]
  WHISPER_MODEL = "small"
  WHISPER_DEVICE = "cpu"
  WHISPER_COMPUTE_TYPE = "int8"
  WORKSPACE_DIR = "/data"
  MAX_UPLOAD_MB = "2048"

[[mounts]]
  source = "cutbackito_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
